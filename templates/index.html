<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brochure and PDS Translate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <style>
    #progress-container { display: none; }
    canvas { width: 150px !important; height: 150px !important; }
    .title-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 1.5rem; }
    .title-bar img { height: 40px; }
    .credit { position: fixed; bottom: 10px; right: 20px; font-size: 0.85em; color: #6c757d; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="title-bar">
      <img src="{{ url_for('static', filename='images/dextra.png') }}" alt="Dextra Logo">
      <h2 class="mb-0">Dextra Document Translator</h2>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert alert-danger">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data" onsubmit="startProgress();">
      <input type="hidden" name="job_id" id="jobId">
      <div class="mb-3">
        <label class="form-label fw-bold">Upload DOCX file</label>
        <input class="form-control" type="file" name="file" accept=".docx" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold" for="language">Select Target Language
          <span class="fw-normal text-muted">({{ languages|length }} available)</span></label>
        <input class="form-control mb-2" type="search" id="langFilter" placeholder="Type to filter, e.g. thai, port, zh" autocomplete="off">
        <select class="form-select" name="language" id="language" size="8" required>
          {% for code, name in languages %}
          <option value="{{ code }}" {% if code == default_language %}selected{% endif %}>{{ name }} ({{ code }})</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Translate</button>
    </form>

    <div id="progress-container" class="mt-5 text-center">
      <h4>Translation Progress</h4>
      <canvas id="progressChart"></canvas>
      <p id="progressText" class="mt-3"></p>
    </div>

    <p id="quotaInfo" class="text-muted text-end mt-4" style="font-size: 0.9em;"></p>
  </div>

  <div class="credit">© 2025 by Paradorn Katananon</div>

  <script>
    let chart, interval, jobId, seenActive = false;

    // Filter the language list as the user types (matches name or code).
    const langSelect = document.getElementById("language");
    document.getElementById("langFilter").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      let firstMatch = null;
      for (const opt of langSelect.options) {
        const match = !q || opt.text.toLowerCase().includes(q);
        opt.hidden = !match;
        if (match && !firstMatch) firstMatch = opt;
      }
      const sel = langSelect.selectedOptions[0];
      if ((!sel || sel.hidden) && firstMatch) firstMatch.selected = true;
    });
    langSelect.selectedOptions[0]?.scrollIntoView({ block: "nearest" });

    function newJobId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'job-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    }

    Chart.register({
      id: 'centerText',
      beforeDraw(chart) {
        const {width, height} = chart;
        const ctx = chart.ctx;
        ctx.restore();
        const fontSize = (height / 114).toFixed(2);
        ctx.font = `${fontSize}em sans-serif`;
        ctx.textBaseline = "middle";
        const data = chart.data.datasets[0].data;
        const total = data[0] + data[1];
        const percentText = total ? `${Math.round((data[0] / total) * 100)}%` : "0%";
        const textX = Math.round((width - ctx.measureText(percentText).width) / 2);
        const textY = height / 2;
        ctx.fillText(percentText, textX, textY);
        ctx.save();
      }
    });

    function startProgress() {
      jobId = newJobId();
      document.getElementById("jobId").value = jobId;
      document.getElementById("progress-container").style.display = "block";
      document.getElementById("progressText").textContent = "Starting...";
      if (chart) chart.destroy();
      const ctx = document.getElementById("progressChart").getContext('2d');
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Translated', 'Remaining'],
          datasets: [{
            data: [0, 1],
            backgroundColor: ['#0d6efd', '#e9ecef'],
            borderWidth: 1
          }]
        },
        options: {
          cutout: '70%',
          plugins: { tooltip: false, legend: { display: false } }
        },
        plugins: ['centerText']
      });

      clearInterval(interval);
      seenActive = false;
      interval = setInterval(fetchProgress, 500);
    }

    async function fetchProgress() {
      const res = await fetch('/progress/' + encodeURIComponent(jobId));
      const data = await res.json();

      if (!data.active) {
        // Job finished (download sent) once we've seen it running.
        if (seenActive) {
          clearInterval(interval);
          chart.data.datasets[0].data = [1, 0];
          chart.update();
          document.getElementById("progressText").textContent = "Done - your download should start now.";
        }
        return;
      }
      seenActive = true;

      const percent = data.total ? Math.round((data.current / data.total) * 100) : 0;
      chart.data.datasets[0].data = [data.current, data.total - data.current];
      chart.update();

      document.getElementById("progressText").textContent =
        `${data.current} / ${data.total} paragraphs translated (${percent}%)`;

      if (data.current >= data.total && data.total !== 0) {
        clearInterval(interval);
      }
    }

    async function fetchQuota() {
      try {
        const res = await fetch('/quota');
        const data = await res.json();
        if (data.remaining !== undefined) {
          document.getElementById("quotaInfo").textContent =
            `API usage: ${data.used.toLocaleString()} / ${data.limit.toLocaleString()} characters`;
        } else {
          document.getElementById("quotaInfo").textContent = "Unable to fetch quota.";
        }
      } catch (err) {
        document.getElementById("quotaInfo").textContent = "Unable to fetch quota.";
      }
    }

    fetchQuota();
  </script>
</body>
</html>
